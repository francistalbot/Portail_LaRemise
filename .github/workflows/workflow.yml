name: Cypress component tests
on:
  push: { branches: ["**"] }
  pull_request:
jobs:
  component:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Test (Vitest)
        run: npm run test
      - name: Run Cypress
        run: npm run ct:run
      - name: Run Cypress
        run: npm run e2e:run
